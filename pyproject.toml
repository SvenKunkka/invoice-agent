[project]
name = "personal-invoice-agent"
version = "0.1.0"
description = "Local Taobao and JD buyer invoice assistant"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.38,<1",
  "playwright>=1.56,<2",
  "beautifulsoup4>=4.14,<5",
  "cryptography>=46,<52",
  "pypdf>=6.21.4,<7",
]

[dependency-groups]
dev = ["pytest>=8.4,<10", "httpx>=0.28,<1", "pip-audit>=2.9,<3"]

[tool.pytest.ini_options]
pythonpath = ["server"]
testpaths = ["tests"]

[tool.uv]
package = false
